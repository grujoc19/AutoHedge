[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "autohedge"
version = "0.1.5"
description = "Modular multi-agent market research for the AutoHedge fork"
readme = "README.md"
license = "MIT"
authors = [{name = "Kye Gomez", email = "kye@apac.ai"}]
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.28,<0.29",
    "litellm==1.76.1",
    "loguru>=0.7,<0.8",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "rich>=14,<16",
    "solders>=0.29,<0.30",
    "swarms==16.0.1",
    "yfinance>=1.7,<2",
]

[project.scripts]
autohedge = "autohedge.cli:main"

[project.urls]
Repository = "https://github.com/grujoc19/AutoHedge"
Issues = "https://github.com/grujoc19/AutoHedge/issues"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.poetry]
packages = [{include = "autohedge"}]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["experimental"]
